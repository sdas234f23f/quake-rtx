name: macOS CI

on: [push, pull_request]

jobs:
  build-mac-os:
    name: Build macOS
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release, Debug]
    steps:
    - uses: actions/checkout@v6
    - name: Install Dependencies
      run: brew install molten-vk vulkan-headers glslang spirv-tools sdl3 libvorbis flac opus opusfile flac mpg123 cmake ninja
    - name: Build vkQuake
      run: |
        cmake -B build -DCMAKE_BUILD_TYPE=${{ matrix.configuration }}
        cmake --build build
    - name: Extract debug information and bundle it to .dSYM
      run: |
        dsymutil build/vkquake -o build/vkquake.dSYM
        du -sh build/vkquake build/vkquake.dSYM
        dwarfdump --uuid build/vkquake build/vkquake.dSYM
    - name: Upload vkQuake
      uses: actions/upload-artifact@v7
      with:
        name: vkQuake archive (${{ matrix.configuration }}${{ matrix.use-sdl3 == 'disabled' && ', SDL2' || '' }})
        path: |
          build/vkquake
          build/vkquake.dSYM
